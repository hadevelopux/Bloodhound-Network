<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodhound Network Forensics | Powered by HADEVELOPUX</title>
    <!-- Tailwind CSS (via CDN with strict security) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        core: {
                            50: '#f6f7f9',
                            100: '#ecedf2',
                            200: '#d5d7e2',
                            300: '#b1b6c8',
                            400: '#878fa7',
                            500: '#67708b',
                            600: '#525a74',
                            700: '#43495f',
                            800: '#393f50',
                            900: '#323644',
                            950: '#1b1d25',
                        },
                        neon: {
                            green: '#39ff14',
                            blue: '#00f3ff',
                            purple: '#b000ff',
                            red: '#ff003c'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Vue.js 3 CDN (Reemplazo Oficial de Vanilla JS) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="font-sans bg-core-100 dark:bg-core-950 text-core-800 dark:text-core-200 h-screen w-full overflow-hidden flex">
    <div id="app" class="flex-1 h-full flex flex-col overflow-hidden min-w-0">
        
        <header-widget 
            :conn-status="connStatus"
            :conn-class="connClass"
            :total-bytes="totalBytes"
            :total-packets="totalPackets"
            :time-remaining="timeRemaining"
            :translations="translations"
            :current-lang="currentLang"
            :is-dark="isDark"
            @toggle-legend="showLegend = true"
            @toggle-lang="toggleLang"
            @toggle-theme="toggleTheme"
        ></header-widget>

        <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
            <!-- Left Column (Widgets) -->
            <aside class="flex flex-col lg:w-[400px] xl:w-[450px] h-full shrink-0 border-r border-core-300 dark:border-core-800 bg-core-50 dark:bg-core-900/50">
                
                <alerts-widget
                    :alerts="stats.alerts"
                    :translations="translations"
                    :current-lang="currentLang"
                    :get-alert-style="getAlertStyle"
                    @reset-alerts="resetAlerts"
                ></alerts-widget>

                <connections-widget
                    :connections="stats.connections"
                    :translations="translations"
                    :current-lang="currentLang"
                    :escape-h-t-m-l="escapeHTML"
                    @reset-conns="resetConns"
                ></connections-widget>

            </aside>

            <!-- Main Packet Stream Table -->
            <main-table
                :packets="filteredPackets"
                :current-category-filter="currentCategoryFilter"
                :translations="translations"
                :current-lang="currentLang"
                :escape-h-t-m-l="escapeHTML"
                :get-alert-style="getAlertStyle"
                :get-proto-class="getProtoClass"
                @set-category="setCategory"
                @clear-filters="clearFilters"
                @factory-reset="factoryReset"
            ></main-table>

        </div>

        <legend-modal
            :show="showLegend"
            :translations="translations"
            :current-lang="currentLang"
            @close="showLegend = false"
        ></legend-modal>

    </div>

    <!-- Carga de Componentes y Lógica Vue -->
    <script src="lang.js"></script>
    <script src="components/HeaderWidget.js"></script>
    <script src="components/AlertsWidget.js"></script>
    <script src="components/ConnectionsWidget.js"></script>
    <script src="components/MainTable.js"></script>
    <script src="components/LegendModal.js"></script>
    <script src="app.js"></script>
</body>
</html>
