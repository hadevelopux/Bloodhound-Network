<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodhound Network Forensics | Powered by HADEVELOPUX</title>
    <!-- Tailwind CSS (via CDN with strict security) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            cyan: '#00f0ff',
                            green: '#39ff14',
                            red: '#ff003c',
                            yellow: '#fcee0a',
                            purple: '#b026ff'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Vue.js 3 CDN (Reemplazo Oficial de Vanilla JS) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="font-sans bg-stone-100 dark:bg-stone-950 text-stone-800 dark:text-stone-200 h-screen w-full overflow-hidden flex">
    <div id="app" class="flex-1 h-full flex flex-col overflow-hidden min-w-0">
        
        <header-widget 
            :conn-status="connStatus"
            :conn-class="connClass"
            :total-bytes="totalBytes"
            :total-packets="totalPackets"
            :time-remaining="timeRemaining"
            :translations="translations"
            :current-lang="currentLang"
            :is-dark="isDark"
            @toggle-legend="showLegend = true"
            @toggle-lang="toggleLang"
            @toggle-theme="toggleTheme"
        ></header-widget>

        <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
            <!-- Left Column (Widgets) -->
            <aside class="flex flex-col lg:w-[400px] xl:w-[450px] h-full shrink-0 border-r border-stone-300 dark:border-stone-800 bg-stone-50 dark:bg-stone-900/50">
                
                <alerts-widget
                    :alerts="stats.alerts"
                    :translations="translations"
                    :current-lang="currentLang"
                    @reset-alerts="resetAlerts"
                ></alerts-widget>

                <connections-widget
                    :connections="stats.connections"
                    :translations="translations"
                    :current-lang="currentLang"
                    :escape-h-t-m-l="escapeHTML"
                    @reset-conns="resetConns"
                ></connections-widget>

            </aside>

            <!-- Main Packet Stream Table -->
            <main-table
                :packets="filteredPackets"
                :current-category-filter="currentCategoryFilter"
                :translations="translations"
                :current-lang="currentLang"
                :escape-h-t-m-l="escapeHTML"
                :get-proto-class="getProtoClass"
                @set-category="setCategory"
                @clear-filters="clearFilters"
                @factory-reset="factoryReset"
            ></main-table>

        </div>

        <legend-sidebar
            :show="showLegend"
            @close="showLegend = false"
        ></legend-sidebar>

    </div>

    <!-- Carga de Componentes y Lógica Vue -->
    <script src="lang.js"></script>
    <script src="components/UiButton.js"></script>
    <script src="components/AlertBadge.js"></script>
    <script src="components/UiWidgetPanel.js"></script>
    <script src="components/LegendItem.js"></script>
    <script src="components/UiInput.js"></script>
    <script src="components/HeaderWidget.js"></script>
    <script src="components/AlertsWidget.js"></script>
    <script src="components/ConnectionsWidget.js"></script>
    <script src="components/MainTable.js"></script>
    <script src="components/LegendSidebar.js"></script>
    <script src="app.js"></script>
</body>
</html>
