<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bloodhound Forensics | Powered by HADEVELOPUX</title>
</head>
<body class="font-sans bg-core-100 dark:bg-core-950 text-core-800 dark:text-core-200 h-screen w-full overflow-hidden">
    <div class="w-full h-full flex flex-col">
        <header class="bg-white dark:bg-core-900 border-b border-core-300 dark:border-core-800 p-3 md:px-6 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-3">
                <span class="pulse-dot w-3 h-3 bg-red-500 rounded-full shadow-[0_0_10px_var(--tw-shadow-color)] shadow-red-500 animate-pulse"></span>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-tight"><span class="text-core-600 dark:text-core-400">Bloodhound</span> Forensics</h1>
            </div>
            <div class="flex items-center gap-5">
                <input type="text" id="searchInput" placeholder="Live BPF Filter (e.g. tcp.port == 80)" autocomplete="off"
                    class="bg-core-200 dark:bg-core-800 border border-core-300 dark:border-core-700 text-core-800 dark:text-core-200 px-4 py-2 rounded-md font-mono w-64 md:w-[350px] outline-none focus:border-core-400 dark:focus:border-core-500 transition-all">
                <div class="flex gap-4 text-sm font-mono items-center">
                    <span id="connStatus" class="text-red-500 font-bold">Disconnected</span>
                    <span>Pkts: <span id="pktCounter">0</span></span>
                    <button id="themeToggleBtn" class="p-1.5 rounded-md hover:bg-core-200 dark:hover:bg-core-800 transition-colors cursor-pointer text-core-600 dark:text-core-400 ml-2">
                        <svg id="themeIconDark" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <svg id="themeIconLight" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">
            <!-- Left Column (Widgets) -->
            <aside class="flex flex-col lg:w-[400px] xl:w-[450px] h-full shrink-0 border-r border-core-300 dark:border-core-800 bg-core-50 dark:bg-core-900/50">
                <div class="flex-1 flex flex-col overflow-hidden min-h-0 border-b border-core-300 dark:border-core-800">
                    <div class="bg-core-200 dark:bg-core-900 px-4 py-3 font-semibold text-sm text-core-800 dark:text-core-300 border-b border-core-300 dark:border-core-800 flex justify-between items-center">
                        <span>Vulnerabilities / Alerts</span>
                        <button id="resetAlertsBtn" class="text-xs bg-core-300 dark:bg-core-800 hover:bg-core-400 dark:hover:bg-core-700 px-2 py-1 rounded transition-colors cursor-pointer">Reset</button>
                    </div>
                    <div class="flex justify-between px-4 py-1.5 text-xs text-core-500 dark:text-core-400 border-b border-core-300 dark:border-core-800 bg-core-100 dark:bg-core-900/80 font-mono">
                        <span>Alert Type / Context</span>
                        <span>Occurrences</span>
                    </div>
                    <ul id="alertsList" class="flex-1 overflow-y-auto p-2.5 font-mono text-sm"></ul>
                </div>
                <div class="flex-1 flex flex-col overflow-hidden min-h-0">
                    <div class="bg-core-200 dark:bg-core-900 px-4 py-3 font-semibold text-sm text-core-800 dark:text-core-300 border-b border-core-300 dark:border-core-800 flex justify-between items-center">
                        <span>Recurring Connections (IP:Port)</span>
                        <button id="resetConnsBtn" class="text-xs bg-core-300 dark:bg-core-800 hover:bg-core-400 dark:hover:bg-core-700 px-2 py-1 rounded transition-colors cursor-pointer">Reset</button>
                    </div>
                    <div class="flex justify-between px-4 py-1.5 text-xs text-core-500 dark:text-core-400 border-b border-core-300 dark:border-core-800 bg-core-100 dark:bg-core-900/80 font-mono">
                        <span>Source IP -> Dest IP : Port</span>
                        <span>Packets Sent</span>
                    </div>
                    <ul id="connsList" class="flex-1 overflow-y-auto p-2.5 font-mono text-sm"></ul>
                </div>
            </aside>

            <!-- Right Column (Table) -->
            <main class="flex-1 flex flex-col overflow-hidden min-w-0 bg-white dark:bg-core-950">
                <!-- Tabs/Filters Header -->
                <div class="bg-core-100 dark:bg-core-900 px-4 py-3 border-b border-core-300 dark:border-core-800 flex flex-col gap-2 shrink-0">
                    <div class="font-semibold text-sm text-core-800 dark:text-core-300 flex justify-between items-center">
                        <span>Real-Time Context Filters</span>
                        <button id="clearFiltersBtn" class="text-xs bg-core-300 dark:bg-core-800 hover:bg-core-400 dark:hover:bg-core-700 px-2 py-1 rounded transition-colors cursor-pointer">Clear Filter</button>
                    </div>
                    <div class="flex flex-wrap gap-2 text-xs font-mono" id="filterButtonsContainer">
                        <button class="filter-btn active bg-core-300 dark:bg-core-700 text-core-900 dark:text-core-100 px-2 py-1 rounded border border-core-400 dark:border-core-600 transition-all cursor-pointer" data-filter="">All</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="BOTNET">Botnet</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="TROJAN">Trojan/C2</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="NMAP">Nmap Scan</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="PLAINTEXT">Plaintext</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="DNS HIJACKED">DNS Hijacked</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="CRYPTOMINER">Crypto</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="EXFILTRATION">Exfiltration</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="PHISHING">Phishing</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="TRACKING">Tracking/Adware</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="SYN-SCAN">SYN-Scan</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="LOCAL SCAN">Local Scan</button>
                        <button class="filter-btn bg-core-200 dark:bg-core-800 hover:bg-core-300 dark:hover:bg-core-700 text-core-600 dark:text-core-400 px-2 py-1 rounded border border-core-300 dark:border-core-700 transition-all cursor-pointer" data-filter="HTTP-404">HTTP-404</button>
                    </div>
                </div>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left font-mono text-sm border-collapse">
                        <thead class="sticky top-0 bg-core-100 dark:bg-core-900 text-core-500 dark:text-core-400 border-b border-core-300 dark:border-core-800 z-10">
                            <tr>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Time</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Source</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Sport</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Destination</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Dport</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Proto</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap border-r border-core-300/50 dark:border-core-800/50">Size</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Info / Alerts</th>
                            </tr>
                        </thead>
                        <tbody id="packetBody" class="divide-y divide-core-200 dark:divide-core-800/50">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
