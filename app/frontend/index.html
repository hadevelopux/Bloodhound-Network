<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bloodhound Forensics | Powered by HADEVELOPUX</title>
</head>
<body class="font-sans">
    <div class="max-w-[1600px] mx-auto p-5 flex flex-col h-screen">
        <header class="glass rounded-xl p-4 md:px-6 flex justify-between items-center mb-5">
            <div class="flex items-center gap-3">
                <span class="pulse-dot w-3 h-3 bg-neon-red rounded-full shadow-[0_0_10px_var(--tw-shadow-color)] shadow-neon-red animate-pulse"></span>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-tight"><span class="neon-text-cyan">Bloodhound</span> Forensics</h1>
            </div>
            <div class="flex items-center gap-5">
                <input type="text" id="searchInput" placeholder="Live BPF Filter (e.g. tcp.port == 80)" autocomplete="off"
                    class="bg-black/40 border border-white/10 text-slate-200 px-4 py-2.5 rounded-md font-mono w-64 md:w-[350px] outline-none focus:border-neon-cyan focus:shadow-[0_0_8px_rgba(0,240,255,0.2)] transition-all">
                <div class="flex gap-4 text-sm font-mono">
                    <span id="connStatus" class="text-neon-red">Disconnected</span>
                    <span>Pkts: <span id="pktCounter">0</span></span>
                </div>
            </div>
        </header>

        <div class="flex flex-col lg:flex-row gap-5 flex-1 overflow-hidden">
            <!-- Left Column (Widgets) -->
            <aside class="flex flex-col gap-5 lg:w-[400px] xl:w-[450px] h-full shrink-0">
                <div class="glass rounded-xl flex-1 flex flex-col overflow-hidden min-h-0">
                    <div class="bg-[#0a0f19]/95 px-4 py-3 font-semibold text-sm neon-text-cyan border-b border-white/10 flex justify-between items-center">
                        <span>Vulnerabilities / Alerts</span>
                        <button id="resetAlertsBtn" class="text-xs bg-white/10 hover:bg-white/20 text-white px-2 py-1 rounded transition-colors cursor-pointer">Reset</button>
                    </div>
                    <div class="flex justify-between px-4 py-1.5 text-xs text-slate-400 border-b border-white/5 bg-[#0a0f19]/50 font-mono">
                        <span>Alert Type / Context</span>
                        <span>Occurrences</span>
                    </div>
                    <ul id="alertsList" class="flex-1 overflow-y-auto p-2.5 font-mono text-sm"></ul>
                </div>
                <div class="glass rounded-xl flex-1 flex flex-col overflow-hidden min-h-0">
                    <div class="bg-[#0a0f19]/95 px-4 py-3 font-semibold text-sm neon-text-cyan border-b border-white/10 flex justify-between items-center">
                        <span>Recurring Connections (IP:Port)</span>
                        <button id="resetConnsBtn" class="text-xs bg-white/10 hover:bg-white/20 text-white px-2 py-1 rounded transition-colors cursor-pointer">Reset</button>
                    </div>
                    <div class="flex justify-between px-4 py-1.5 text-xs text-slate-400 border-b border-white/5 bg-[#0a0f19]/50 font-mono">
                        <span>Source IP -> Dest IP : Port</span>
                        <span>Packets Sent</span>
                    </div>
                    <ul id="connsList" class="flex-1 overflow-y-auto p-2.5 font-mono text-sm"></ul>
                </div>
            </aside>

            <!-- Right Column (Table) -->
            <main class="glass rounded-xl flex-1 flex flex-col overflow-hidden min-w-0">
                <!-- Tabs/Filters Header -->
                <div class="bg-[#0a0f19]/95 px-4 py-3 border-b border-white/10 flex flex-col gap-2 shrink-0">
                    <div class="font-semibold text-sm neon-text-cyan flex justify-between items-center">
                        <span>Real-Time Context Filters</span>
                        <button id="clearFiltersBtn" class="text-xs bg-white/10 hover:bg-white/20 text-white px-2 py-1 rounded transition-colors cursor-pointer">Clear Filter</button>
                    </div>
                    <div class="flex flex-wrap gap-2 text-xs font-mono" id="filterButtonsContainer">
                        <button class="filter-btn active bg-neon-cyan/20 text-neon-cyan px-2 py-1 rounded border border-neon-cyan/50 transition-all cursor-pointer shadow-[0_0_8px_rgba(0,240,255,0.2)]" data-filter="">All</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="BOTNET">Botnet</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="TROJAN">Trojan/C2</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="NMAP">Nmap Scan</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="PLAINTEXT">Plaintext</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="DNS HIJACKED">DNS Hijacked</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="CRYPTOMINER">Crypto</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="EXFILTRATION">Exfiltration</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="PHISHING">Phishing</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="TRACKING">Tracking/Adware</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="SYN-SCAN">SYN-Scan</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="LOCAL SCAN">Local Scan</button>
                        <button class="filter-btn bg-white/5 hover:bg-white/10 text-slate-300 px-2 py-1 rounded border border-white/10 transition-all cursor-pointer" data-filter="HTTP-404">HTTP-404</button>
                    </div>
                </div>
                <div class="overflow-y-auto flex-1">
                    <table class="w-full text-left font-mono text-sm border-collapse">
                        <thead class="sticky top-0 bg-[#0a0f19]/95 text-slate-400 border-b border-white/10 z-10">
                            <tr>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Time</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Source</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Sport</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Destination</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Dport</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Proto</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Size</th>
                                <th class="py-3 px-4 font-semibold whitespace-nowrap">Info / Alerts</th>
                            </tr>
                        </thead>
                        <tbody id="packetBody" class="divide-y divide-white/5">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="./app.js"></script>
</body>
</html>
